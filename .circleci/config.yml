version: 2.1

jobs:
  build-web-prod:
    docker:
      - image: cimg/base:2023.08
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image
          command: docker build --target=prod -t "studio1way/web:prod_${CIRCLE_SHA1:0}" .
      - run:
          name: Save image as tar
          command: |
            mkdir -p images && docker image save -o "images/studio1way_web_prod_${CIRCLE_SHA1}" "studio1way/web:prod_${CIRCLE_SHA1:0}"
      - persist_to_workspace:
          root: .
          paths:
            - images

  build-web-test:
    docker:
      - image: cimg/base:2023.08
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image
          command: docker build --target=dev -t "studio1way/web:test_${CIRCLE_SHA1:0}" .
      - run:
          name: Save image as tar
          command: |
            mkdir -p images && docker image save -o "images/studio1way_web_test_${CIRCLE_SHA1}" "studio1way/web:test_${CIRCLE_SHA1:0}"
      - persist_to_workspace:
          root: .
          paths:
            - images

  build-frontend:
    docker:
      - image: cimg/base:2023.08
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build image
          command: docker build -t "studio1way/frontend:${CIRCLE_SHA1:0}" -f ./frontend/Dockerfile .
      - run:
          name: Save image as tar
          command: |
            mkdir -p images && docker image save -o "images/studio1way_frontend_${CIRCLE_SHA1}" "studio1way/frontend:${CIRCLE_SHA1:0}"
      - persist_to_workspace:
          root: .
          paths:
            - images

  test-web:
    docker:
      - image: cimg/base:2023.08
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Load image
          command: |
            docker image load < "images/studio1way_web_test_${CIRCLE_SHA1}"
      - run:
          name: Test
          command: |
            docker run "studio1way/web:test_${CIRCLE_SHA1}" ./mvnw test

  test-frontend:
    docker:
      - image: cimg/base:2023.08
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Load image
          command: |
            docker image load < "images/studio1way_frontend_${CIRCLE_SHA1}"
      - run:
          name: Test
          command: |
            docker run "studio1way/frontend:${CIRCLE_SHA1}" npm run test-ci

  # Preview screenshots for PRs: captures the pages the branch changes
  # and posts them to the PR (bin/ci/post-previews). Posting uses the
  # GITHUB_COMMENT_TOKEN env var - a fine-grained token, this repo
  # only, Issues + Pull requests read/write (both are required).
  screenshots:
    docker:
      - image: cimg/base:2023.08
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build prod image
          command: docker build --target=prod -t "studio1way/web:prod_${CIRCLE_SHA1:0}" .
      - run:
          name: Boot the site and wait for it
          command: |
            docker run -d --name site -e PORT=8080 "studio1way/web:prod_${CIRCLE_SHA1:0}"
            CODE=000
            for i in $(seq 1 36); do
              CODE=$(docker run --rm --network container:site curlimages/curl:latest -s -o /dev/null -w '%{http_code}' http://localhost:8080/wood || echo 000)
              echo "probe $i: HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                echo "site is up"
                break
              fi
              sleep 5
            done
            if [ "$CODE" != "200" ]; then
              echo "site never came up — logs:"
              docker logs site 2>&1 | tail -40
              exit 1
            fi
      - run:
          name: Choose pages from the diff
          command: |
            mkdir -p screenshots
            PAGES=screenshots/pages.txt
            : > "$PAGES"
            add_page() {
              grep -qx "$1 $2" "$PAGES" || echo "$1 $2" >> "$PAGES"
            }
            add_project() {
              base=$(basename "$1" .json)
              id="${base//_/-}"
              add_page "$2" "$3"
              add_page "$2/project/$id" "$3__project__$id"
            }
            git fetch origin main
            CHANGED=$(git diff --name-only origin/main...HEAD || echo "")
            echo "changed files:"
            echo "$CHANGED"
            BLAST=0
            for f in $CHANGED; do
              case "$f" in
                src/main/resources/projects/woodworks/*.json) add_project "$f" /wood wood ;;
                src/main/resources/projects/ceramicwares/*.json) add_project "$f" /ceramics ceramics ;;
                src/main/resources/projects/paintings/*.json) add_project "$f" /paint paint ;;
                src/main/resources/projects/experiments/*.json) add_project "$f" /experimental experimental ;;
                frontend/*|src/main/java/*|pom.xml) BLAST=1 ;;
              esac
            done
            if [ "$BLAST" = 1 ]; then
              add_page / home
              add_page /ceramics ceramics
              add_page /paint paint
              add_page /wood wood
              add_page /experimental experimental
            fi
            head -8 "$PAGES" > "$PAGES.tmp" && mv "$PAGES.tmp" "$PAGES"
            echo "pages to capture:"
            cat "$PAGES"
      - run:
          name: Screenshot the chosen pages
          command: |
            OK=0
            TOTAL=0
            while read -r path file; do
              [ -z "$path" ] && continue
              TOTAL=$((TOTAL + 1))
              for attempt in 1 2; do
                docker rm -f shots > /dev/null 2>&1 || true
                docker run --name shots --network container:site zenika/alpine-chrome:124 --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1100 --virtual-time-budget=15000 --screenshot=/tmp/shot.png "http://localhost:8080$path" || true
                if docker cp shots:/tmp/shot.png "screenshots/$file.png" 2>/dev/null && [ -s "screenshots/$file.png" ]; then
                  echo "captured $path -> $file.png"
                  OK=$((OK + 1))
                  break
                fi
                echo "attempt $attempt failed for $path"
              done
            done < screenshots/pages.txt
            ls -la screenshots/
            echo "captured $OK of $TOTAL pages"
            if [ "$TOTAL" -gt 0 ] && [ "$OK" -eq 0 ]; then
              exit 1
            fi
      - store_artifacts:
          path: screenshots
          destination: screenshots
      - run:
          name: Post screenshots to the PR
          command: bin/ci/post-previews

  deploy:
    docker:
      - image: cimg/base:2023.08
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Load image
          command: |
            docker image load < "images/studio1way_web_prod_${CIRCLE_SHA1}"
      - run:
          name: Retag for deployment
          command: |
            docker tag "studio1way/web:prod_${CIRCLE_SHA1}" "registry.heroku.com/${HEROKU_APP_NAME}/web"
      - run:
          name: Deploy
          command: bin/deploy-ci


workflows:
  run-jobs:
    jobs:
      - build-web-test
      - build-frontend
      - test-web:
          requires:
            - build-web-test
      - test-frontend:
          requires:
            - build-frontend
      - screenshots
      - build-web-prod:
          requires:
            - test-web
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build-web-prod
            - test-frontend
          filters:
            branches:
              only:
                - main